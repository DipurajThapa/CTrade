# Deriv payout census -- configuration
#
# The decision thresholds in this file are PRE-REGISTERED. Commit this file
# before starting the run, and do not change the thresholds after seeing
# results. Adjusting them afterwards turns a measurement into an expensive way
# of confirming what you hoped.

connection:
  endpoint: "wss://ws.derivws.com/websockets/v3"
  # Register your own application id at https://api.deriv.com/ and set it via
  # the DERIV_APP_ID environment variable rather than committing it here.
  # 1089 is Deriv's public test id; fine for a preflight, but a fourteen-day
  # run should use your own so throttling is attributable to you.
  app_id: "1089"
  ca_bundle: null          # only needed behind a TLS-terminating proxy
  open_timeout_s: 20.0
  request_timeout_s: 20.0
  ping_interval_s: 30.0
  backoff_initial_s: 2.0
  backoff_max_s: 120.0

rate_limit:
  # Deliberately conservative. Check Deriv's currently published limits before
  # raising these; a fourteen-day run is exactly where an over-eager client
  # gets throttled or blocked.
  requests_per_minute: 60
  max_concurrent_proposals: 12
  max_concurrent_ticks: 8

grid:
  markets: ["forex"]
  symbols: []              # empty = every tradeable symbol in `markets`
  # Synthetic and broker-created instruments are excluded: their price process
  # is generated by the counterparty, so their statistics say nothing about a
  # real-market strategy.
  exclude_patterns:
    ["synthetic", "volatility", "boom", "crash", "jump", "step",
     "range break", "otc"]

  # 60s is deliberately absent. At a one-minute horizon the settlement-tie rate
  # on a major FX pair is of the same order as the entire directional edge a
  # good model can produce, which makes strict Rise/Fall structurally
  # unplayable there. Add 60 only to quantify that, never to trade it.
  durations_seconds: [120, 180, 300]

  variants: ["strict", "equals"]   # CALL/PUT and CALLE/PUTE
  directions: ["rise"]             # preflight verifies rise/fall symmetry
  stake: 10.0
  currency: "USD"

sampling:
  dwell_seconds: 90.0              # hold each batch; also measures payout drift
  rotation_pause_seconds: 2.0
  duration_days: 14.0
  rediscover_every_minutes: 60.0   # picks up session opens and closes

decision:
  # Thresholds are on REQUIRED EDGE -- the directional skill needed to break
  # even, inclusive of the settlement-tie penalty -- not on the raw house
  # margin, which understates the hurdle at short durations.
  #
  # Calibration: an out-of-sample information coefficient of 0.03-0.08 on
  # short-horizon FX, after purged walk-forward and deflation for selection
  # bias, is a directional edge of roughly 1.2-3.2pp. That band is what a
  # genuinely good model delivers, and it is what these thresholds bracket.
  go_max_required_edge: 0.015          # 1.5pp -- reachable by a strong model
  conditional_max_required_edge: 0.030 # 3.0pp -- top of the achievable band
  min_proposals_per_cell: 200
  min_settlement_samples_per_cell: 500

storage:
  root: "data"
  flush_interval_s: 5.0
